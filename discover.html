<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discover | CineVerse</title>

    <link rel="stylesheet" href="./style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Orbitron:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="./index.html" class="logo">
            <i class="fa-solid fa-film"></i>
            Cine<span>Verse</span>
        </a>

        <nav class="nav-links">

            <a href="./index.html">Home</a>

            <a href="./discover.html" class="active">
                Discover
            </a>

            <a href="./genres.html">
                Genres
            </a>

            <a href="./trending.html">
                Trending
            </a>

            <a href="./watchlist.html">
                <i class="fa-regular fa-heart"></i>
                Watchlist
            </a>

        </nav>

        <button class="theme-button" id="themeButton">
            <i class="fa-solid fa-palette"></i>
        </button>

        <button class="menu-button" id="menuButton">
            <i class="fa-solid fa-bars"></i>
        </button>

    </header>


    <!-- PAGE HEADER -->

    <section class="page-header">

        <span class="section-tag">
            MOVIE DISCOVERY
        </span>

        <h1>
            Discover Your Next
            <span>Favorite Movie.</span>
        </h1>

        <p>
            Explore movies from every genre and find something
            worth watching tonight.
        </p>

    </section>


    <!-- SEARCH -->

    <section class="discover-controls">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="movieSearch"
                placeholder="Search movies..."
            >

        </div>

        <button class="filter-button" id="allMoviesBtn">
            All Movies
        </button>

    </section>


    <!-- MOVIES -->

    <main class="movie-section">

        <div class="section-heading">

            <div>
                <span class="section-tag">
                    EXPLORE
                </span>

                <h2>All Movies</h2>
            </div>

            <span id="movieCount" class="movie-count"></span>

        </div>

        <div class="movie-grid" id="discoverMovies">

            <!-- Movies generated by JavaScript -->

        </div>

    </main>


    <script src="./script.js"></script>

</body>

</html>
